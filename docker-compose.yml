services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Injects the backend API URL into Vite during container build; defaults to relative /api/v1
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: vstore-frontend
    # Map unprivileged Nginx port (8080) to host port 8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Periodic container health probe against the Nginx /healthz endpoint
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
