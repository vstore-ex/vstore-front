name: Frontend CI

on:
  push:
    branches: [main, fix/*, feat/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & Verify Vite SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high || echo "::warning::High or critical vulnerabilities detected in npm dependencies."

      - name: Run ESLint
        run: npm run lint

      - name: Build Vite application
        run: npm run build

  build-docker:
    name: Build & Push Docker Image
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Frontend via SSH
    needs: [build-docker]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    concurrency: production
    steps:
      - name: Pull, restart frontend and verify health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/opt/vstore' }}"
            cd "$DEPLOY_PATH"

            # Acquire deployment lock to prevent race conditions with other repositories
            exec 200>"$DEPLOY_PATH/.deploy.lock"
            echo "==> Acquiring deployment lock..."
            flock -w 300 200 || { echo "ERROR: Timeout waiting for deployment lock!"; exit 1; }

            # Record currently running image ID for rollback before pulling new image
            PREV_IMAGE=$(docker inspect --format='{{.Image}}' $(docker compose ps -q frontend 2>/dev/null) 2>/dev/null || true)
            echo "==> Active frontend image ID before deploy: ${PREV_IMAGE:-none}"

            echo "==> Pulling latest frontend image..."
            docker compose pull frontend

            echo "==> Restarting frontend..."
            docker compose up -d --no-deps frontend

            echo "==> Verifying frontend and API proxy health..."
            RETRIES=15
            HEALTHY=false
            for i in $(seq 1 $RETRIES); do
              if curl -sf http://127.0.0.1:3000/healthz > /dev/null 2>&1 && \
                 curl -sf http://127.0.0.1:3000/api/v1/games/ > /dev/null 2>&1; then
                echo "Frontend static server and API proxy are healthy!"
                HEALTHY=true
                break
              fi
              echo "Waiting for frontend and API proxy health check ($i/$RETRIES)..."
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: Frontend failed health check!"
              docker compose logs --tail=50 frontend
              if [ -n "$PREV_IMAGE" ]; then
                echo "==> Initiating automated rollback to previous image: $PREV_IMAGE"
                FRONTEND_IMAGE="$PREV_IMAGE" docker compose up -d --no-deps frontend
                echo "==> Rollback completed. Restored previous container."
              else
                echo "==> No previous image found to rollback."
              fi
              exit 1
            fi

            echo "==> Cleaning up unused images..."
            docker image prune -f

            echo "==> Frontend deployment completed successfully."
