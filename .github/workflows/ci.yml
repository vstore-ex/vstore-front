name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & Verify Vite SPA
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high || echo "::warning::High or critical vulnerabilities detected in npm dependencies."

      - name: Build Vite application
        run: npm run build

  build-docker:
    name: Build & Push Docker Image
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: vstore-ex/vstore-infra/.github/workflows/build-and-push.yml@main
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy Frontend via SSH
    needs: [build-docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: vstore-ex/vstore-infra/.github/workflows/deploy-service.yml@main
    permissions:
      contents: read
    with:
      services: frontend
      image: ${{ needs.build-docker.outputs.image }}
      image-env-var: FRONTEND_IMAGE
      health-url: http://127.0.0.1:3000/healthz
    secrets: inherit
