name: Commitlint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commitlint
    uses: vstore-ex/vstore-infra/.github/workflows/commitlint.yml@41b0ea43dc2173a61b3e246d005e56640d5d6849 # shared commitlint
